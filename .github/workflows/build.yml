name: Build PSG1208 OpenWRT firmware

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "extroot = 基础固件(Tailscale装U盘, 推荐) / builtin = 内置Tailscale(可能溢出)"
        required: true
        default: "extroot"
        type: choice
        options:
          - extroot
          - builtin

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils build-essential libncurses5-dev \
            zlib1g-dev gawk git unzip file wget

      - name: Build firmware
        run: |
          chmod +x build_psg1208_tailscale.sh
          MODE="${{ github.event.inputs.mode }}" ./build_psg1208_tailscale.sh

      - name: Collect build outputs and logs
        if: always()
        run: |
          mkdir -p out
          cp -a ib_psg1208/openwrt-imagebuilder-*/bin/targets/ramips/mt7620/ out/ 2>/dev/null || true
          cp -a ib_psg1208/openwrt-imagebuilder-*/logs/ out/ 2>/dev/null || true

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psg1208-firmware
          path: out/
          retention-days: 30
